# AI PR Review — drop-in for GitHub. Same engine file as Azure.
name: AI PR Review
on:
  pull_request:
  workflow_dispatch:
    inputs:
      target-branch:
        default: main
      create-pr:
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Copilot CLI
        run: npm i -g @github/copilot
      - name: AI code review
        env:
          REVIEW_PLATFORM: github
          MODEL_PROVIDER: copilot
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          BASE="${GITHUB_BASE_REF:-${{ inputs.target-branch }}}"
          ARGS=""
          [ "${{ inputs.create-pr }}" = "true" ] && ARGS="--create-pr"
          python .ai-review/ai-pr-review.pyz --target-branch "$BASE" $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-pr-review-report
          path: pr_review_output.md
          if-no-files-found: ignore
