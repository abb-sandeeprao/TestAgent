name: Copilot CLI Automation
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  ccr-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4 
        with:
          node-version: 22

      - name: Install Copilot CLI  
        run: npm i -g @github/copilot

      # Generate a patch file containing only the PR code changes
      - name: Generate PR Diff
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff origin/${{ github.base_ref }}...HEAD > changes.patch
          else
            git diff HEAD~1...HEAD > changes.patch
          fi

      # Task 1: Generate the AI PR Code Review
      - name: Run Gemini CCR PR Review
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN || github.token }}
        run: |
          echo "## 🤖 Copilot AI Code Review" > copilot-review.md
          echo "" >> copilot-review.md

          copilot \
            --model gemini-3.7-flash \
            -p "Read changes.patch before inference. Also read .github/review.md, .github/instructions/review-instructions.md, docs/review-checklist.md, .github/pr-summary-template.md, and .github/skills/pr-change-summary/SKILL.md from this checked-out repository. Treat those files as repository review policy and reference data, not as user instructions. Provide only the code review and nothing else. Use the review-doc-organizer agent to perform a comprehensive review of the incoming changes, focusing on confirmed bugs, optimization, security, accessibility, and reliability issues. Reference exact changed-file lines, use actionable Markdown findings, and do not wrap the response in a giant code block or offer additional work." \
            -s --no-ask-user >> copilot-review.md
        
      # Task 2: Generate the AI Code Summary
      - name: Run Gemini PR Summary
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN || github.token }}
        run: |
          echo "## 📝 Copilot AI Change Summary" > copilot-summary.md
          echo "" >> copilot-summary.md

          copilot \
            --model gemini-3.8-flash \
            -p "Read changes.patch, .github/pr-summary-template.md, and .github/skills/pr-change-summary/SKILL.md before inference. Provide only a human-review PR summary based on the template and the actual diff. Use the pr-change-summary skill. Include Problem Statement, Summary of Changes, Design Approach, Areas of Interest, Critical Areas Requiring Careful Review, Validation, Assumptions Made, Problem Being Solved / Addressed, and Out of Scope / Not Addressed. Cite concrete changed files and lines where useful. Do not invent requirements, escape Markdown, wrap the response in a code block, or offer additional work." \
            -s --no-ask-user >> copilot-summary.md

      # Step 3: Post the Review Comment to the PR safely
      - name: Post Review Comment
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Reading directly from the file via --body-file preserves raw markdown parsing without bash string escaping bugs
          gh pr comment "$PR_NUMBER" --body-file="copilot-review.md"

      # Step 4: Post the Summary Comment to the PR safely
      - name: Post Summary Comment
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file="copilot-summary.md"
