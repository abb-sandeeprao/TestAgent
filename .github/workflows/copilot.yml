name: Copilot CLI Automation
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

  push:
      branches:
        - main

jobs:
  copilot-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cod
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6 
        with:
          node-version: 22 # Copilot CLI requires Node.js 22+

      - name: Install Copilot CLI  
        run: npm i -g @github/copilot

      - name: Run Copilot Command
        env:
          # Use PAT if available, otherwise fall back to the built-in GITHUB_TOKEN
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN || github.token }}
        run: |
          copilot \
            -p "Use the review-doc-organizer  agent and perform a code review and use pr-change-summary skill to provide a summary of the code for human review." \
            -s --no-ask-user
