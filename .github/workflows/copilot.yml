name: Copilot CLI Automation
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  copilot-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Copilot CLI
        run: npm i -g @github/copilot

      - name: Generate PR Diff
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff origin/${{ github.base_ref }}...HEAD > changes.patch
          else
            git diff HEAD~1...HEAD > changes.patch
          fi

      - name: Run Copilot PR Review
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN || github.token }}
        run: |
          echo "## 🤖 Copilot AI Code Review" > copilot-review.md
          echo "" >> copilot-review.md

          REVIEW_INSTRUCTIONS=$(cat .github/review.md)

          copilot \
            --model gpt-5.6-luna \
            -p "$REVIEW_INSTRUCTIONS

          Apply the process above to the code changes in changes.patch. Provide only the review findings and nothing else. Do not offer to do anything additional. Output the response in raw, clean, beautifully formatted Markdown without enclosing the entire response inside a giant markdown code block or quotes." \
            -s --no-ask-user >> copilot-review.md

      - name: Run Copilot AI Summarizer
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN || github.token }}
        run: |
          echo "## 📝 Copilot AI Change Summary" > copilot-summary.md
          echo "" >> copilot-summary.md

          copilot \
            --model gpt-5.6-luna \
            -p "Provide only the changes summary and nothing else. Do not offer to do anything additional. Use the pr-change-summary skill to provide a high-level architectural and logical breakdown of the code changes provided inside changes.patch for human review. Output the response in clean, structural Markdown. Do not escape formatting or wrap the text in structural quotes." \
            -s --no-ask-user >> copilot-summary.md

      - name: Post Review Comment
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.body | startswith("## 🤖 Copilot AI Code Review"))] | last | .id')

          if [ -n "$COMMENT_ID" ] && [ "$COMMENT_ID" != "null" ]; then
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" -X PATCH -f body=@copilot-review.md
          else
            gh pr comment "$PR_NUMBER" --body-file="copilot-review.md"
          fi

      - name: Post Summary Comment
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.body | startswith("## 📝 Copilot AI Change Summary"))] | last | .id')

          if [ -n "$COMMENT_ID" ] && [ "$COMMENT_ID" != "null" ]; then
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" -X PATCH -f body=@copilot-summary.md
          else
            gh pr comment "$PR_NUMBER" --body-file="copilot-summary.md"
          fi
